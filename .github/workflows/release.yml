name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: edotex

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Verify tag matches Cargo.toml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG passt nicht zu Cargo.toml-Version $CARGO_VERSION"
            exit 1
          fi

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build native dependencies
        run: make deps

      - name: Check
        run: make check

  build:
    name: Build ${{ matrix.target.os }}
    needs: check
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-latest
            archive: edotex-linux-x86_64
            musl: true
          - os: ubuntu-24.04-arm
            archive: edotex-linux-aarch64
            musl: true
          - os: macos-latest
            archive: edotex-macos-aarch64
            musl: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Node
        if: ${{ !matrix.target.musl }}
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust
        if: ${{ !matrix.target.musl }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target.musl && 'musl' || 'native' }}

      - name: Build native dependencies
        if: ${{ !matrix.target.musl }}
        run: make deps

      - name: Build
        if: ${{ !matrix.target.musl }}
        run: make build

      # Static musl binary built in an Alpine container; runs on any Linux distribution.
      - name: Build (static musl)
        if: ${{ matrix.target.musl }}
        run: JOBS=4 sh scripts/build-linux-musl.sh

      # The container runs as root; rust-cache needs the files back to clean and save.
      - name: Restore file ownership
        if: ${{ always() && matrix.target.musl }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo" target .deps web 2>/dev/null || true

      - name: Verify static binary
        if: ${{ matrix.target.musl }}
        run: |
          readelf -d target/release/edotex | tee linkage.txt || true
          if grep -q NEEDED linkage.txt; then
            echo "::error::Binary is not fully static"
            exit 1
          fi

      - name: Verify native linkage
        if: ${{ !matrix.target.musl }}
        run: |
          sh scripts/check-native-linkage.sh target/release/edotex

      - name: Smoke test
        run: |
          ./target/release/edotex --version

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/edotex dist/
          tar -C dist -czf "${{ matrix.target.archive }}.tar.gz" edotex

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.archive }}
          path: ${{ matrix.target.archive }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
