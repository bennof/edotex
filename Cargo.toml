[package]
name = "edotex"
version = "0.2.0-alpha.5"
edition = "2024"
license = "MIT"

[features]
default = ["server","png"]
server = ["dep:axum", "dep:tokio", "dep:httpdate", "dep:rust-embed", "dep:tokio-stream", "dep:http-body-util", "dep:tower-http", "dep:multer", "dep:tempfile"]
png = ["dep:hayro"]
# Menu bar / tray app for desktop users (macOS; Windows prepared). No effect on Linux.
desktop = ["server", "dep:tray-icon", "dep:tao", "dep:png"]

[[bin]]
name = "edotex"
path = "src/bin/edotex.rs"
required-features = ["server"]

[profile.release]
opt-level = 3
strip = true

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tectonic = "0.17.0"
include_dir = "0.7"
tectonic_bridge_core = "0.5.3"
axum = { version = "0.8.9", optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
httpdate = { version = "1.0.3", optional = true }
rust-embed = { version = "8.12", features = ["debug-embed"], optional = true }
tokio-stream = { version = "0.1", optional = true }
http-body-util = { version = "0.1", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
multer = { version = "3", optional = true }
tempfile = { version = "3", optional = true }
hayro = {version = "0.8.0", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26.1", optional = true, default-features = false }
tao = { version = "0.37.2", optional = true }
png = { version = "0.18.1", optional = true }
