# edotex behind nginx. Include inside a server { } block:
#   include snippets/edotex.conf;
# Port must match server.port in /etc/edotex/config.json.

# API: POST /edotex/api/tex (TeX -> PDF), POST /edotex/api/png (PDF -> PNG).
location /edotex/api/ {
    # add auth code if needed here, e.g. auth_basic "Restricted"; auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://127.0.0.1:8283/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # edotex accepts up to 20 MB (TeX document plus images).
    client_max_body_size 20m;

    # The compile log is streamed while TeX runs; do not buffer it.
    proxy_buffering off;
    proxy_request_buffering off;

    # Compiling (and the first download of TeX packages) can take a while.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

